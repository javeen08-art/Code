<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> 
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>I Love Lebron</title>
  <link rel="stylesheet" href="goat.css">
  
  <style>
    /* Essential styles to ensure smooth fleeing movement */
    .no {
      display: inline-block;
      position: relative;
      /* Smooth transition for natural evasion */
      transition: transform 0.15s ease-out;
      user-select: none;
    }
  </style>
</head>
<body>

  <h4>DO YOU LIKE LEBRON?</h4>

  <img src="a.jpeg" alt="lebron">

  <div class="options">
    <p>Yesss LeBron is daddy 🥰</p>
    <div class="no" id="noContainer">
      <p>No tf ew</p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noContainer');
    const triggerDistance = 150; // Distance in pixels to trigger movement
    const escapeDistance = 120;  // How far the element gets pushed per frame

    let currentX = 0;
    let currentY = 0;

    document.addEventListener('mousemove', (e) => {
      // 1. Get current bounding box and center coordinates of the "No" button
      const rect = noBtn.getBoundingClientRect();
      const btnCenterX = rect.left + rect.width / 2;
      const btnCenterY = rect.top + rect.height / 2;

      // 2. Calculate distance between mouse pointer and button center
      const deltaX = e.clientX - btnCenterX;
      const deltaY = e.clientY - btnCenterY;
      const distance = Math.hypot(deltaX, deltaY);

      // 3. If mouse gets too close, move button away
      if (distance < triggerDistance) {
        // Angle pointing from mouse center to button center
        const angle = Math.atan2(deltaY, deltaX);

        // Calculate proposed step in X and Y directions away from mouse
        let stepX = -Math.cos(angle) * escapeDistance;
        let stepY = -Math.sin(angle) * escapeDistance;

        // Proposed new screen coordinates of the button
        let newRectLeft = rect.left + stepX;
        let newRectRight = rect.right + stepX;
        let newRectTop = rect.top + stepY;
        let newRectBottom = rect.bottom + stepY;

        const padding = 10; // Margin from screen edge

        // Check horizontal screen collision & bounce direction if needed
        if (newRectLeft < padding || newRectRight > window.innerWidth - padding) {
          stepX = -stepX; // Reverse horizontal escape direction
        }

        // Check vertical screen collision & bounce direction if needed
        if (newRectTop < padding || newRectBottom > window.innerHeight - padding) {
          stepY = -stepY; // Reverse vertical escape direction
        }

        // Update accumulated offsets
        currentX += stepX;
        currentY += stepY;

        // Clamp offsets so button never goes out of bounds regardless
        const initialRect = noBtn.getBoundingClientRect();
        // Calculate bounds based on initial un-translated position
        const origLeft = initialRect.left - currentX;
        const origTop = initialRect.top - currentY;

        const minX = padding - origLeft;
        const maxX = window.innerWidth - padding - initialRect.width - origLeft;
        const minY = padding - origTop;
        const maxY = window.innerHeight - padding - initialRect.height - origTop;

        currentX = Math.max(minX, Math.min(maxX, currentX));
        currentY = Math.max(minY, Math.min(maxY, currentY));

        // Apply dynamic translation
        noBtn.style.transform = `translate(${currentX}px, ${currentY}px)`;
      }
    });
  </script>

</body>
</html>
